version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Frontend Web Client (React 18 + Vite + Nginx)
  # http://localhost:3000 or http://localhost:80
  # -------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shramikid-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - shramikid-network

  # -------------------------------------------------------------
  # 2. Backend REST API Server (Node.js + Express + Prisma)
  # http://localhost:5000
  # -------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shramikid-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-shramikid_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:-shramikid_super_secret_jwt_key_2026_bd_secure_token}"
      JWT_EXPIRES_IN: "7d"
      SMS_GATEWAY_PROVIDER: "${SMS_GATEWAY_PROVIDER:-sandbox}"
      SMS_API_KEY: "${SMS_API_KEY:-}"
      SMS_SENDER_ID: "${SMS_SENDER_ID:-ShramikID}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shramikid-network

  # -------------------------------------------------------------
  # 3. PostgreSQL Primary Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shramikid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shramikid_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shramikid-network

  # -------------------------------------------------------------
  # 4. Redis (In-Memory Cache & Rate Limiting)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shramikid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shramikid-network

  # -------------------------------------------------------------
  # 5. Database Web GUI Manager (Adminer)
  # http://localhost:8080
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: shramikid-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - shramikid-network

networks:
  shramikid-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
