version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Primary Database (ACID Relational Storage)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shramikid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shramikid_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis (In-Memory Cache, Rate Limiting & Queue)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shramikid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Optional Lightweight DB Web Manager (Adminer)
  # http://localhost:8080
  # -------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: shramikid-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
